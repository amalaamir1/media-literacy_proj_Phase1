[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-literacy-phase1"
version = "0.1.0"
description = "Phase 1 FIGNEWS data preparation for the Social Media Literacy project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<22",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

